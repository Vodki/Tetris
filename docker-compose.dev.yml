version: "3.8"

services:
  backend:
    build:
      context: ./backend
      target: development # Use dev stage
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ./backend/.air.toml:/app/.air.toml
    environment:
      - PORT=8080
      - GIN_MODE=debug
      - MONGODB_URI=mongodb://mongo:27017  # Use Docker service name
      - MONGODB_DB=LeaderBoard

    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      target: development # Use dev stage
    ports:
      - "3000:3000" # Dev server port
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - app-network


  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db  # Persist data between container restarts
    networks:
      - app-network

  mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=secret
    depends_on:
      - mongo
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data: