version: "3.8"

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8080:8080"
    networks:
      - app-network
    environment:
      - PORT=8080
      - MONGODB_URI=mongodb://admin:supersecret@mongo:27017/leaderboard_prod?authSource=admin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 30s

  mongo:
    image: mongo:7.0
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=supersecret
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data: